name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Test on a case-sensitive Linux filesystem
        run: dotnet run --project SPLog.Tests -c Release -f net8.0
      - name: Build both package targets
        run: dotnet pack SPLog/SPLog.csproj -c Release -o artifacts/packages
      - name: Test packaged assemblies on Linux
        shell: pwsh
        run: |
          [xml]$project = Get-Content SPLog/SPLog.csproj
          $version = $project.Project.PropertyGroup.PackageVersion | Where-Object { $_ }
          $source = Join-Path $PWD 'artifacts/packages'
          dotnet run --project SPLog.Tests -c Release -f net8.0 -p:SPLogPackageVersion=$version -p:RestoreAdditionalProjectSources=$source
          exit $LASTEXITCODE
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build all targets
        run: dotnet build SPLog.sln -c Release -m:1
      - name: Test .NET 8
        run: dotnet run --project SPLog.Tests -c Release -f net8.0 --no-build
      - name: Test .NET Framework 4.7.2 target
        run: dotnet run --project SPLog.Tests -c Release -f net472 --no-build
      - name: Verify .NET Framework JSON configuration and file output
        run: dotnet run --project SPLog.Net472.Verify -c Release --no-build
      - name: Concurrent logging smoke test
        run: dotnet run --project SPLog.StressRunner -c Release --no-build -- --duration 00:00:05 --status 00:00:02 --producers 2 --payload 32 --burst 20
      - name: Build NuGet package
        run: dotnet pack SPLog/SPLog.csproj -c Release --no-build -o artifacts/packages
      - name: Verify packaged assemblies on both runtimes
        shell: pwsh
        run: |
          [xml]$project = Get-Content SPLog/SPLog.csproj
          $version = $project.Project.PropertyGroup.PackageVersion | Where-Object { $_ }
          $source = Join-Path $PWD 'artifacts/packages'
          foreach ($framework in @('net8.0', 'net472')) {
            dotnet run --project SPLog.Tests -c Release -f $framework -p:SPLogPackageVersion=$version -p:RestoreAdditionalProjectSources=$source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --project SPLog.Net472.Verify -c Release -p:SPLogPackageVersion=$version -p:RestoreAdditionalProjectSources=$source
          exit $LASTEXITCODE
